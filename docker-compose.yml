services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bsglem-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ACTIVE_DATASET=2024
      - DATA_SOURCE_MODE=historical
      - ENABLE_SIMULATION_MODE=false
      - CORS_ORIGINS=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: bsglem-dashboard
    ports:
      - "8501:8501"
    environment:
      - BSGLEM_API_URL=http://backend:8000
      - PORT=8501
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
